<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encontros — Desenvolvimento NUI</title>
    <style>
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #050406; color: #fff; font: 14px Arial, sans-serif; }
      .toolbar { display: flex; flex-wrap: wrap; flex-shrink: 0; gap: 8px; align-items: center; padding: 12px; background: #1b1420; border-bottom: 1px solid rgba(255, 18, 239, 0.35); }
      button { border: 1px solid rgba(255, 255, 255, 0.32); border-radius: 6px; padding: 9px 12px; cursor: pointer; color: #fff; background: linear-gradient(135deg, #ff12ef, #8c24ff); }
      iframe { display: block; width: 100%; flex: 1; min-height: 0; border: 0; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <strong>Prévia da NUI</strong>
      <button type="button" onclick="showAdmin()">Painel admin</button>
      <button type="button" onclick="showInfo()">Encontro ativo</button>
      <button type="button" onclick="showEmpty()">Sem encontros</button>
      <button type="button" onclick="showClaims()">Prêmios no NPC</button>
      <button type="button" onclick="showClaims('event')">Prêmios no encontro</button>
      <button type="button" onclick="showNotice()">Aviso (10s)</button>
      <button type="button" onclick="markDemoNotice()">Simular H</button>
      <button type="button" onclick="finishDemoPlacement(true)">Confirmar NPC</button>
      <button type="button" onclick="finishDemoPlacement(false)">Cancelar NPC</button>
      <span>Dados fictícios · sem conexão com o servidor FiveM</span>
    </div>

    <iframe id="preview" src="ui.html" title="Prévia da NUI"></iframe>

    <script>
      const preview = document.getElementById('preview');
      const blipIcons = [
        { sprite: 280, label: 'Grupo / encontro' },
        { sprite: 225, label: 'Carro' },
        { sprite: 226, label: 'Moto' },
        { sprite: 38, label: 'Bandeira de corrida' },
        { sprite: 93, label: 'Bar / festa' },
      ];
      const rewardTables = {
        pecas_carro: { label: 'Performance de Carro', enabled: true },
        pecas_moto: { label: 'Performance de Moto', enabled: true },
        pecas_caminhao: { label: 'Caminhão — bloqueado', enabled: false },
      };
      const blipConfigs = {
        encontro: { sprite: 280, color: 3, scale: 0.9, label: 'Encontro', radius: 50, requiresNpc: true },
        marcador: { sprite: 280, color: 5, scale: 0.9, label: 'Marcador', radius: 0, requiresNpc: false },
      };
      const publicUi = {
        title: 'Encontros do Sertão',
        subtitle: 'Confira os encontros ativos agora',
        emptyTitle: 'Nenhum encontro ativo',
        emptyText: 'Quando um encontro estiver acontecendo, ele aparecerá aqui.',
        logo: '',
        mascot: '',
        footer: '',
        showBrand: false,
        showMascot: false,
        theme: {
          background: '#030405',
          surface: '#090a0c',
          card: '#101114',
          primary: '#1e3a8a',
          secondary: '#172554',
          text: '#f5f5f5',
          muted: '#a3a3a3',
          border: 'rgba(255, 255, 255, 0.13)',
        },
      };
      const activeEvent = {
        id: 1,
        title: 'Sunset no Pier',
        description: 'Venha conhecer pessoas e curtir o fim de tarde.',
        location: 'Pier de Santa Monica',
        event_type: 'encontro',
        blip_sprite: 280,
        reward_item: '',
        reward_enabled: 1,
        reward_table: 'pecas_carro',
        coords: { x: -1570.78, y: -1018.64, z: 13.02 },
        radius: 50,
        height_tolerance: 15,
        start_time: Math.floor(Date.now() / 1000) - 600,
        duration: 90,
        status: 'active',
        recurring: 0,
      };
      const send = (data) => preview.contentWindow.postMessage(data, '*');
      const attendance = {
        '1': { seconds: 450, current_required_seconds: 300, planned_required_seconds: 2700, inside: true },
        '3': { seconds: 120, current_required_seconds: 300, planned_required_seconds: 2700, inside: false },
      };
      const now = Math.floor(Date.now() / 1000);
      const claims = [
        { id: 101, event_title: 'Sunset no Pier', item: 'jv_piston_forjado', label: 'Pistão Forjado', image: 'jv_piston_forjado.png', amount: 1, expires_at: now + 3600, status: 'pending' },
        { id: 102, event_title: 'Encontro das Duas Rodas', item: 'jv_camshaft_moto_drag', label: 'Comando Moto Drag', image: 'jv_camshaft_moto_drag.png', amount: 1, expires_at: now + 80000, status: 'pending' },
        { id: 103, event_title: 'Encontro da semana passada', item: 'jv_engineblock_titanio', label: 'Bloco de Titânio', image: 'jv_engineblock_titanio.png', amount: 1, expires_at: now - 60, status: 'expired' },
      ];
      const showAdmin = () => send({
        action: 'showAdmin',
        defaultRadius: 50,
        defaultHeight: 15,
        blipIcons,
        blipConfigs,
        rewardTables,
        events: [activeEvent,
          { ...activeEvent, id: 2, title: 'Marcador do comboio', event_type: 'marcador', reward_enabled: 0, radius: 0, status: 'scheduled', start_time: activeEvent.start_time + 7200 },
          { ...activeEvent, id: 4, title: 'Encontro anterior à atualização', status: 'cancelled', status_reason: 'Recrie o encontro para iniciar a nova contagem de presença.' },
        ],
      });
      const showInfo = () => send({ action: 'showInfo', publicUi, attendance, events: [activeEvent, { ...activeEvent, id: 3, title: 'Encontro de carros e motos do Sertão — edição especial de fim de semana', location: 'Estacionamento do Diamond Casino' }] });
      const showEmpty = () => send({ action: 'showInfo', publicUi, attendance: {}, events: [] });
      let demoPickupKind = 'fixed';
      const fixedNpc = { x: 1829.39, y: 3844.86, z: 36.75, w: 122.80 };
      const demoClaimData = () => ({ claims: demoPickupKind === 'event' ? claims.slice(0, 1) : claims,
        pickup_kind: demoPickupKind, fixed_npc_coords: fixedNpc, server_time: Math.floor(Date.now() / 1000) });
      const showClaims = (kind = 'fixed') => {
        demoPickupKind = kind;
        send({ action: 'showClaims', publicUi, ...demoClaimData() });
      };
      let demoNotice = null;
      let demoTimer = null;
      const showNotice = () => {
        window.clearInterval(demoTimer);
        preview.contentWindow.closePanel();
        const started = Date.now();
        demoNotice = { id: `1:${Math.floor(started / 1000)}`, title: 'Encontro de carros e motos do Sertão — edição especial de fim de semana', location: 'Estacionamento do Diamond Casino', durationMs: 10000, remainingMs: 10000, marked: false };
        send({ action: 'showStartNotice', notice: demoNotice, publicUi });
        demoTimer = window.setInterval(() => {
          demoNotice.remainingMs = Math.max(0, 10000 - (Date.now() - started));
          if (demoNotice.remainingMs <= 0) {
            send({ action: 'hideStartNotice', id: demoNotice.id });
            demoNotice = null;
            window.clearInterval(demoTimer);
          } else send({ action: 'updateStartNotice', notice: demoNotice });
        }, 100);
      };
      const markDemoNotice = () => {
        if (!demoNotice || demoNotice.marked) return;
        demoNotice.marked = true;
        send({ action: 'updateStartNotice', notice: demoNotice });
      };
      let demoPlacement = null;
      const finishDemoPlacement = (confirmed) => {
        if (!demoPlacement) return;
        send({ action: 'finishNpcPlacement', confirmed, coords: confirmed ? demoPlacement : undefined });
        demoPlacement = null;
      };
      const demoKey = (event) => {
        if (demoPlacement) {
          const step = event.shiftKey ? 1 : 0.1;
          const moves = { ArrowUp: ['y', step], ArrowDown: ['y', -step], ArrowLeft: ['x', -step], ArrowRight: ['x', step], '+': ['z', step], '=': ['z', step], '-': ['z', -step] };
          if (moves[event.key]) {
            event.preventDefault();
            const [axis, delta] = moves[event.key];
            demoPlacement[axis] += delta;
            send({ action: 'updateNpcPlacement', coords: demoPlacement });
          } else if (event.key === 'Enter' || event.key === 'Escape') {
            event.preventDefault();
            finishDemoPlacement(event.key === 'Enter');
          }
        } else if (event.key.toLowerCase() === 'h') markDemoNotice();
      };
      window.addEventListener('keydown', demoKey);
      preview.addEventListener('load', () => {
        // Only this development iframe uses simulated callbacks. Production ui.html
        // always talks to FiveM through the real NUI transport.
        preview.contentWindow.fetch = async (url, options = {}) => {
          const action = String(url).split('/').pop();
          const payload = JSON.parse(options.body || '{}');
          let response = { ok: true };
          if (action === 'refreshClaims') response = { ok: true, ...demoClaimData() };
          if (action === 'claimReward') {
            const claim = claims.find((entry) => entry.id === Number(payload.id));
            if (claim && claim.status === 'pending' && claim.expires_at > Math.floor(Date.now() / 1000)) {
              claim.status = 'claimed';
              response = { ok: true, message: `Prévia: você recebeu 1x ${claim.label}.` };
            } else response = { ok: false, reason: 'Prêmio indisponível nesta prévia.' };
          }
          if (action === 'getPlayerCoords') response = { x: 100, y: 200, z: 30, w: 180 };
          if (action === 'placeRewardNpc') {
            demoPlacement = payload.coords || { x: 100, y: 202, z: 30, w: 180 };
            send({ action: 'showNpcPlacement', coords: demoPlacement });
          }
          return { json: async () => response };
        };
        preview.contentWindow.addEventListener('keydown', demoKey);
        preview.contentWindow.addEventListener('wheel', (event) => {
          if (!demoPlacement) return;
          demoPlacement.w = (demoPlacement.w + (event.deltaY < 0 ? 5 : -5) + 360) % 360;
          send({ action: 'updateNpcPlacement', coords: demoPlacement });
        });
        showAdmin();
      });
    </script>
  </body>
</html>
